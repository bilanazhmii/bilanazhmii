<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="BotIndo project card">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="760" height="250" rx="24" fill="#0B0F17"/>
  <rect x="1" y="1" width="758" height="248" rx="23" fill="none" stroke="#263042"/>
  <circle cx="660" cy="74" r="90" fill="#06B6D4" opacity="0.13" filter="url(#soft)">
    <animate attributeName="cx" values="640;690;640" dur="8s" repeatCount="indefinite"/>
  </circle>
  <path d="M-20 205 C180 120 290 260 470 180 S650 120 790 155" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.75">
    <animate attributeName="d"
      values="M-20 205 C180 120 290 260 470 180 S650 120 790 155;
              M-20 170 C180 240 300 100 480 185 S650 220 790 125;
              M-20 205 C180 120 290 260 470 180 S650 120 790 155"
      dur="10s" repeatCount="indefinite"/>
  </path>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="42" y="62" fill="#8F9BB0" font-size="13" letter-spacing="3">FEATURED PROJECT</text>
    <text x="42" y="116" fill="#F8FAFC" font-size="34" font-weight="800">BotIndo</text>
    <text x="42" y="148" fill="#A8B0C2" font-size="17">Automation / bot project</text>
    <text x="660" y="154" fill="#6366F1" font-size="62" font-weight="700" text-anchor="middle">⌁</text>
    <rect x="42" y="183" width="106" height="34" rx="17" fill="url(#g)" opacity="0.93">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="95" y="205" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">EXPLORE →</text>
  </g>
</svg>