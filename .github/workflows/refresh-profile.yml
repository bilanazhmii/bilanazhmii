name: Refresh profile

on:
  workflow_dispatch:
  schedule:
    # GitHub may delay scheduled jobs; this runs once every day.
    - cron: "17 1 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Refresh repository section
        run: python3 scripts/update_profile.py

      - name: Commit changes when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No profile changes."
            exit 0
          fi

          git add README.md
          git commit -m "chore: refresh profile"
          git push
